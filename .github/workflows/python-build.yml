name: Python CI Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check package structure
      run: python -c "import sys; sys.path.insert(0, '.'); from src.utils import setup_logging, load_env_file; print('utils OK'); from src.agent import NewsTechAgent; print('agent OK')"

    - name: Validate config
      run: python -c "import yaml; cfg = yaml.safe_load(open('config.yaml')); print(f'{len(cfg.get(\"domains\", {}))} domains')"
