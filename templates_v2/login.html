<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sign In - NovaPulse AI</title>
<style>
:root {
  --bg: #f5f5f7;
  --card-bg: #ffffff;
  --text: #1d1d1f;
  --text-secondary: #86868b;
  --accent: #0071e3;
  --border: rgba(0,0,0,0.06);
  --input-bg: #f5f5f7;
  --shadow: 0 8px 40px rgba(0,0,0,0.08);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.container {
  width: 100%;
  max-width: 400px;
  padding: 20px;
}

.card {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 36px 28px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.logo {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, #0071e3, #40a9ff);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 20px;
  margin: 0 auto 16px;
  box-shadow: 0 4px 16px rgba(0,113,227,0.3);
}

h1 {
  font-size: 1.5rem; font-weight: 700; text-align: center;
  letter-spacing: -0.02em; margin-bottom: 4px;
}

.subtitle {
  text-align: center; color: var(--text-secondary);
  font-size: 0.85rem; margin-bottom: 28px;
}

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 0.7rem; font-weight: 600;
  color: var(--text-secondary); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.form-control {
  width: 100%; padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 0.9rem; color: var(--text);
  background: var(--input-bg);
  outline: none; font-family: inherit;
  transition: border 0.2s, box-shadow 0.2s;
}
.form-control:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,113,227,0.12);
}

.btn {
  width: 100%; padding: 14px;
  border: none; border-radius: 12px;
  font-size: 0.9rem; font-weight: 600; cursor: pointer;
  background: var(--accent); color: #fff;
  transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
  font-family: inherit;
}
.btn:hover { background: #0077ed; transform: scale(1.01); box-shadow: 0 4px 16px rgba(0,113,227,0.3); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

.toggle {
  text-align: center; margin-top: 20px;
  font-size: 0.8rem; color: var(--text-secondary);
}
.toggle a { color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: none; }
.toggle a:hover { text-decoration: underline; }

.error-msg {
  background: #fef0f0; color: #c41e3a;
  padding: 10px 14px; border-radius: 10px;
  font-size: 0.78rem; margin-bottom: 16px;
  display: none;
}
.error-msg.show { display: block; }

.back-link {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; margin-top: 20px;
  color: var(--text-secondary); font-size: 0.8rem;
  text-decoration: none; transition: color 0.2s;
}
.back-link:hover { color: var(--text); }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="logo">N</div>
    <h1>NovaPulse AI</h1>
    <p class="subtitle">Your intelligent news companion</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group" id="nameGroup" style="display:none;">
        <label>Display Name</label>
        <input type="text" id="regName" class="form-control" placeholder="Choose a display name">
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
      </div>
      <div class="form-group" id="emailGroup" style="display:none;">
        <label>Email</label>
        <input type="email" id="email" class="form-control" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>

    <div class="toggle">
      <span id="toggleText">Don't have an account?</span>
      <a id="toggleLink" onclick="toggleMode()">Sign Up</a>
    </div>

    <a href="/" class="back-link">← Back to News</a>
  </div>
</div>

<script>
let isLogin = true;

function toggleMode() {
  isLogin = !isLogin;
  document.getElementById('nameGroup').style.display = isLogin ? 'none' : 'block';
  document.getElementById('emailGroup').style.display = isLogin ? 'none' : 'block';
  document.getElementById('username').required = isLogin;
  document.getElementById('regName').required = !isLogin;
  document.getElementById('email').required = !isLogin;
  document.getElementById('submitBtn').textContent = isLogin ? 'Sign In' : 'Create Account';
  document.getElementById('toggleText').textContent = isLogin ? "Don't have an account?" : 'Already have an account?';
  document.getElementById('toggleLink').textContent = isLogin ? 'Sign Up' : 'Sign In';
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('authForm').reset();
}

function handleAuth(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Please wait...';
  document.getElementById('errorMsg').classList.remove('show');

  const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
  const data = {
    username: document.getElementById('username').value,
    password: document.getElementById('password').value,
  };
  if (!isLogin) {
    data.email = document.getElementById('email').value;
    data.display_name = document.getElementById('regName').value || data.username;
  }

  fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(async r => {
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Authentication failed');
    return d;
  })
  .then(d => {
    document.cookie = `access_token=${d.token}; path=/; max-age=${7*24*3600}; SameSite=Lax`;
    window.location.href = '/';
  })
  .catch(err => {
    const errEl = document.getElementById('errorMsg');
    errEl.textContent = err.message;
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = isLogin ? 'Sign In' : 'Create Account';
  });
}
</script>
</body>
</html>
