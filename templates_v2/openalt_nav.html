<nav style="background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border-color, rgba(0,0,0,0.06));position:sticky;top:0;z-index:100;">
<div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 20px;height:52px;">
<a href="/browse" style="font-weight:700;font-size:1rem;text-decoration:none;color:var(--text-primary,#1d1d1f);letter-spacing:-0.02em;white-space:nowrap;">NovaPulse AI</a>
<div style="display:flex;gap:4px;margin-left:24px;overflow-x:auto;flex:1;">
{% for item in navigation %}
<a href="{{ item.href }}" style="padding:6px 12px;border-radius:8px;font-size:0.78rem;font-weight:500;text-decoration:none;color:var(--text-secondary,#86868b);white-space:nowrap;transition:all 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)';this.style.color='var(--text-primary,#1d1d1f)'" onmouseout="this.style.background='transparent';this.style.color='var(--text-secondary,#86868b)'">{{ item.icon }} {{ item.name }}</a>
{% endfor %}
</div>
<a href="/" style="margin-left:auto;padding:6px 16px;border-radius:8px;font-size:0.78rem;font-weight:600;text-decoration:none;background:#0071e3;color:#fff;">← News</a>
</div>
</nav>
